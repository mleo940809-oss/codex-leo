<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Weixin 摇一摇高保真原型 v2.20</title>
  <style>
    :root{
      --bg: #f2efe8;
      --bg-2: #e9e1d2;
      --panel: rgba(255,255,255,.78);
      --panel-2: rgba(246,241,231,.92);
      --line: rgba(36,36,36,.12);
      --text: #1c1b1a;
      --muted: #6e675f;
      --brand: #123a4a;
      --brand-2: #356b79;
      --accent: #d76b36;
      --accent-2: #a6441d;
      --good: #1f7a57;
      --warn: #b06a10;
      --danger: #b13c39;
      --shadow: 0 22px 60px rgba(31, 29, 24, .12);
      --shadow-soft: 0 12px 28px rgba(31, 29, 24, .08);
      --radius: 22px;
      --radius-sm: 14px;
      --font-body: "PingFang SC","Hiragino Sans GB","Microsoft YaHei",system-ui,sans-serif;
      --font-display: "Baskerville","Iowan Old Style","Songti SC","STSong","Times New Roman",serif;
    }
    * { box-sizing: border-box; }
    html, body { height: 100%; }
    body {
      margin: 0;
      color: var(--text);
      font-family: var(--font-body);
      background:
        radial-gradient(circle at 20% 10%, rgba(214, 181, 119, .22), transparent 32%),
        radial-gradient(circle at 85% 15%, rgba(53, 107, 121, .18), transparent 28%),
        radial-gradient(circle at 75% 85%, rgba(215, 107, 54, .14), transparent 26%),
        linear-gradient(135deg, var(--bg) 0%, var(--bg-2) 100%);
      overflow-x: hidden;
    }
    body::before{
      content:"";
      position: fixed;
      inset: 0;
      pointer-events:none;
      background:
        linear-gradient(rgba(255,255,255,.055) 1px, transparent 1px),
        linear-gradient(90deg, rgba(255,255,255,.055) 1px, transparent 1px);
      background-size: 46px 46px;
      mask-image: linear-gradient(180deg, rgba(0,0,0,.42), rgba(0,0,0,.06));
      opacity: .38;
    }
    .app{
      width: min(1600px, calc(100vw - 28px));
      margin: 14px auto 24px;
      position: relative;
      z-index: 1;
    }
    .shell{
      display: grid;
      grid-template-columns: 300px 1fr;
      gap: 18px;
      min-height: calc(100vh - 38px);
    }
    .sidebar, .workspace, .card, .modal-panel, .toast, .topbar, .nav-chip {
      backdrop-filter: blur(16px);
    }
    .sidebar{
      background: linear-gradient(180deg, rgba(20, 44, 55, .94), rgba(18, 39, 49, .92));
      color: #f8f3ea;
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 30px;
      padding: 22px;
      box-shadow: var(--shadow);
      display: flex;
      flex-direction: column;
      gap: 18px;
      position: sticky;
      top: 14px;
      align-self: start;
      overflow: hidden;
    }
    .sidebar::after{
      content:"";
      position:absolute;
      inset:auto -40px -80px auto;
      width: 210px;
      height: 210px;
      border-radius: 50%;
      background: radial-gradient(circle, rgba(215,107,54,.36), transparent 65%);
      filter: blur(10px);
      pointer-events:none;
    }
    .brand{
      position: relative;
      z-index: 1;
      display: flex;
      flex-direction: column;
      gap: 10px;
    }
    .brand-badge{
      width: 56px;
      height: 56px;
      border-radius: 18px;
      background: linear-gradient(135deg, rgba(255,255,255,.18), rgba(255,255,255,.06));
      border: 1px solid rgba(255,255,255,.16);
      display:grid;
      place-items:center;
      box-shadow: inset 0 1px 0 rgba(255,255,255,.12);
    }
    .brand-title{
      font-family: var(--font-display);
      font-size: 27px;
      line-height: 1.1;
      letter-spacing: .02em;
      margin: 0;
    }
    .brand-sub{
      color: rgba(248,243,234,.76);
      font-size: 12px;
      line-height: 1.7;
      margin: 0;
    }
    .side-meta{
      position: relative;
      z-index: 1;
      display: grid;
      gap: 12px;
    }
    .meta-card{
      border-radius: 18px;
      padding: 14px 14px 12px;
      background: rgba(255,255,255,.07);
      border: 1px solid rgba(255,255,255,.08);
    }
    .meta-card .k{
      font-size: 12px;
      letter-spacing: .08em;
      text-transform: uppercase;
      color: rgba(248,243,234,.62);
      margin-bottom: 8px;
    }
    .meta-card .v{
      font-size: 14px;
      line-height: 1.55;
    }
    .nav-list{
      display: grid;
      gap: 8px;
      position: relative;
      z-index: 1;
    }
    .nav-item{
      border: 0;
      color: inherit;
      background: rgba(255,255,255,.06);
      border: 1px solid rgba(255,255,255,.08);
      border-radius: 16px;
      padding: 13px 14px;
      text-align: left;
      cursor: pointer;
      display: flex;
      justify-content: space-between;
      align-items: center;
      transition: transform .18s ease, background .18s ease, border-color .18s ease;
    }
    .nav-item:hover{ transform: translateX(2px); background: rgba(255,255,255,.09); }
    .nav-item.active{
      background: linear-gradient(135deg, rgba(215,107,54,.9), rgba(180,70,34,.92));
      border-color: rgba(255,255,255,.22);
      box-shadow: 0 10px 24px rgba(180,70,34,.25);
    }
    .nav-item .name{ font-weight: 700; }
    .nav-item .hint{ font-size: 12px; color: rgba(248,243,234,.72); }
    .workspace{
      display: flex;
      flex-direction: column;
      gap: 16px;
    }
    .topbar{
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 28px;
      box-shadow: var(--shadow-soft);
      padding: 18px 22px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 16px;
      position: sticky;
      top: 14px;
      z-index: 2;
    }
    .crumbs{
      display: flex;
      align-items: center;
      flex-wrap: wrap;
      gap: 10px;
      color: var(--muted);
      font-size: 13px;
    }
    .crumbs strong{
      color: var(--text);
      font-weight: 700;
    }
    .view-title{
      display:flex;
      flex-direction:column;
      gap: 5px;
    }
    .view-title h1{
      margin: 0;
      font-family: var(--font-display);
      font-size: 26px;
      line-height: 1.08;
      letter-spacing: .01em;
    }
    .view-title p{
      margin: 0;
      color: var(--muted);
      font-size: 13px;
    }
    .toolbar{
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
      justify-content:flex-end;
      align-items:center;
    }
    .btn, .mini-btn, .seg-btn, .nav-chip, .pill, .tab-btn, .action-card{
      -webkit-tap-highlight-color: transparent;
    }
    .btn, .mini-btn, .seg-btn, .tab-btn, .nav-chip{
      border: 0;
      cursor: pointer;
      user-select: none;
    }
    .btn{
      min-height: 42px;
      border-radius: 14px;
      padding: 0 16px;
      font-weight: 700;
      font-size: 13px;
      color: var(--text);
      background: linear-gradient(180deg, #fff, #f1eadf);
      border: 1px solid rgba(36,36,36,.1);
      box-shadow: 0 9px 18px rgba(31,29,24,.08);
      transition: transform .18s ease, box-shadow .18s ease, opacity .18s ease;
    }
    .btn:hover, .mini-btn:hover, .seg-btn:hover, .tab-btn:hover, .nav-chip:hover{ transform: translateY(-1px); }
    .btn.primary{
      color:#fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      border-color: rgba(255,255,255,.12);
    }
    .btn.accent{
      color:#fff;
      background: linear-gradient(135deg, var(--accent), #b54b24);
    }
    .btn.green{ color:#fff; background: linear-gradient(135deg, #188160, #1d5e4e); }
    .btn.red{ color:#fff; background: linear-gradient(135deg, #b7433b, #92322f); }
    .btn.ghost{
      background: rgba(255,255,255,.5);
      box-shadow: none;
    }
    .btn:disabled, .mini-btn:disabled, .seg-btn:disabled, .tab-btn:disabled{
      opacity: .42;
      cursor: not-allowed;
      transform: none;
    }
    .mini-btn{
      min-height: 32px;
      padding: 0 11px;
      border-radius: 11px;
      font-size: 12px;
      font-weight: 700;
      color: var(--text);
      background: rgba(255,255,255,.82);
      border: 1px solid rgba(36,36,36,.12);
    }
    .mini-btn.primary{ color:#fff; background: linear-gradient(135deg, var(--brand), var(--brand-2)); }
    .mini-btn.blue{ color:#fff; background: linear-gradient(135deg, #2b6cb0, #24508b); }
    .mini-btn.green{ color:#fff; background: linear-gradient(135deg, #1a7d5b, #18634e); }
    .mini-btn.red{ color:#fff; background: linear-gradient(135deg, #b7433b, #9b322f); }
    .nav-chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      min-height: 34px;
      padding: 0 12px;
      border-radius: 999px;
      background: rgba(255,255,255,.72);
      border: 1px solid rgba(36,36,36,.12);
      color: var(--text);
      font-size: 12px;
      font-weight: 700;
    }
    .nav-chip.active{
      color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
    }
    .nav-chip.warn{
      color: #7a4307;
      background: rgba(255, 206, 146, .54);
      border-color: rgba(181, 122, 35, .14);
    }
    .nav-chip.good{
      color: #0f5f45;
      background: rgba(157, 231, 198, .54);
      border-color: rgba(31, 122, 87, .15);
    }
    .grid{
      display:grid;
      gap: 16px;
    }
    .grid.two{ grid-template-columns: 1.3fr .95fr; }
    .grid.three{ grid-template-columns: repeat(3, minmax(0, 1fr)); }
    .stack{ display:grid; gap: 14px; }
    .card{
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: var(--radius);
      box-shadow: var(--shadow-soft);
      overflow: hidden;
    }
    .card-hd{
      padding: 18px 20px 0;
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap: 14px;
    }
    .card-hd h2, .section-title h3, .panel-title h4{
      margin: 0;
      font-family: var(--font-display);
      letter-spacing: .01em;
    }
    .card-hd h2{ font-size: 22px; }
    .card-hd p{
      margin: 7px 0 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.6;
      max-width: 82ch;
    }
    .card-bd{ padding: 18px 20px 20px; }
    .section{
      background: var(--panel-2);
      border: 1px solid rgba(36,36,36,.08);
      border-radius: 22px;
      padding: 16px;
    }
    .section-title{
      display:flex;
      justify-content:space-between;
      align-items:flex-start;
      gap: 12px;
      margin-bottom: 14px;
    }
    .section-title p{
      margin: 6px 0 0;
      color: var(--muted);
      font-size: 12px;
      line-height: 1.55;
    }
    .chips{ display:flex; flex-wrap:wrap; gap:8px; align-items:center; }
    .chip{
      display:inline-flex;
      align-items:center;
      gap:8px;
      padding: 8px 12px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      background: rgba(255,255,255,.74);
      border: 1px solid rgba(36,36,36,.12);
      color: var(--text);
    }
    .chip strong{ font-weight: 800; }
    .chip.brand{ background: rgba(18,58,74,.08); color: var(--brand); }
    .chip.good{ background: rgba(31,122,87,.1); color: var(--good); }
    .chip.warn{ background: rgba(176,106,16,.12); color: var(--warn); }
    .chip.bad{ background: rgba(177,60,57,.11); color: var(--danger); }
    .chip.soft{ background: rgba(255,255,255,.58); }
    .pill{
      display:inline-flex;
      align-items:center;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 700;
      line-height: 1;
    }
    .pill.hot{ color:#8a4d14; background: rgba(223, 178, 93, .17); }
    .pill.dim{ color:#5d625f; background: rgba(92, 100, 96, .12); }
    .status-tag{
      display:inline-flex;
      align-items:center;
      gap: 6px;
      padding: 6px 10px;
      border-radius: 999px;
      font-size: 12px;
      font-weight: 800;
      line-height: 1;
    }
    .status-tag::before{
      content:"";
      width: 8px;
      height: 8px;
      border-radius: 999px;
      background: currentColor;
      opacity: .9;
    }
    .status-draft{ color:#8b5a14; background: rgba(231, 176, 70, .16); }
    .status-auditing{ color:#546a90; background: rgba(110, 143, 204, .14); }
    .status-effective{ color:#0f6e58; background: rgba(40, 174, 129, .12); }
    .status-deactivated{ color:#8b3e3a; background: rgba(184, 88, 81, .14); }
    .status-sending{ color:#0f6e58; background: rgba(40, 174, 129, .12); }
    .status-paused{ color:#855e10; background: rgba(226, 188, 76, .14); }
    .status-stopped{ color:#8b3e3a; background: rgba(184, 88, 81, .14); }
    .status-ready{ color:#56623a; background: rgba(148, 184, 85, .14); }
    .status-other{ color:#49545c; background: rgba(120, 130, 140, .12); }
    .filter-grid{
      display:grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 12px;
    }
    .field{
      display:grid;
      gap: 8px;
      min-width: 0;
    }
    .field.span-12{ grid-column: span 12; }
    .field.span-6{ grid-column: span 6; }
    .field.span-4{ grid-column: span 4; }
    .field.span-3{ grid-column: span 3; }
    .field.span-2{ grid-column: span 2; }
    .field label{
      font-size: 12px;
      font-weight: 800;
      letter-spacing: .02em;
      color: var(--text);
      display:flex;
      justify-content:space-between;
      gap:10px;
      align-items:baseline;
    }
    .field label .hint{
      color: var(--muted);
      font-weight: 600;
      font-size: 12px;
    }
    input, select, textarea{
      width: 100%;
      min-width: 0;
      border-radius: 14px;
      border: 1px solid rgba(36,36,36,.12);
      background: rgba(255,255,255,.82);
      color: var(--text);
      padding: 12px 13px;
      font: inherit;
      outline: none;
      transition: border-color .15s ease, box-shadow .15s ease, background .15s ease;
    }
    textarea{ min-height: 110px; resize: vertical; line-height: 1.65; }
    input:focus, select:focus, textarea:focus{
      border-color: rgba(53,107,121,.6);
      box-shadow: 0 0 0 4px rgba(53,107,121,.12);
      background: #fff;
    }
    input[readonly]{
      background: rgba(245,241,233,.92);
      color: #685f54;
    }
    .error-text{
      min-height: 16px;
      color: var(--danger);
      font-size: 11px;
      line-height: 1.4;
    }
    .hint-box{
      border-radius: 18px;
      padding: 14px 16px;
      border: 1px solid rgba(36,36,36,.10);
      background: rgba(255,255,255,.72);
      color: var(--text);
      line-height: 1.65;
      font-size: 13px;
    }
    .hint-box.info{ background: rgba(53,107,121,.08); border-color: rgba(53,107,121,.14); }
    .hint-box.success{ background: rgba(31,122,87,.1); border-color: rgba(31,122,87,.14); }
    .hint-box.warn{ background: rgba(176,106,16,.1); border-color: rgba(176,106,16,.18); }
    .hint-box.danger{ background: rgba(177,60,57,.09); border-color: rgba(177,60,57,.16); }
    .table-wrap{
      overflow:auto;
      border-radius: 18px;
      border: 1px solid rgba(36,36,36,.08);
      background: rgba(255,255,255,.6);
    }
    table{
      width: 100%;
      border-collapse: collapse;
      min-width: 1400px;
    }
    thead th{
      position: sticky;
      top: 0;
      z-index: 1;
      background: rgba(248,244,236,.96);
      text-align: left;
      font-size: 12px;
      letter-spacing: .03em;
      color: #50493f;
      padding: 13px 12px;
      border-bottom: 1px solid rgba(36,36,36,.08);
      white-space: nowrap;
    }
    tbody td{
      padding: 12px;
      border-bottom: 1px solid rgba(36,36,36,.06);
      vertical-align: top;
      font-size: 13px;
      line-height: 1.55;
    }
    tbody tr:hover{ background: rgba(255,255,255,.4); }
    .row-actions{
      display:flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .empty{
      padding: 26px 16px;
      text-align:center;
      color: var(--muted);
      font-size: 13px;
    }
    .detail-grid{
      display:grid;
      grid-template-columns: repeat(12, minmax(0, 1fr));
      gap: 12px;
    }
    .kv{
      grid-column: span 3;
      padding: 14px 15px;
      border-radius: 16px;
      background: rgba(255,255,255,.74);
      border: 1px solid rgba(36,36,36,.08);
    }
    .kv .k{
      color: var(--muted);
      font-size: 12px;
      margin-bottom: 6px;
      font-weight: 700;
    }
    .kv .v{
      font-size: 14px;
      line-height: 1.6;
      font-weight: 700;
      color: var(--text);
      word-break: break-word;
    }
    .preview-grid{
      display:grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 12px;
    }
    .art{
      position: relative;
      border-radius: 18px;
      overflow: hidden;
      min-height: 156px;
      border: 1px solid rgba(36,36,36,.08);
      background: linear-gradient(135deg, rgba(18,58,74,.08), rgba(215,107,54,.1));
      box-shadow: inset 0 1px 0 rgba(255,255,255,.16);
    }
    .art img{
      width: 100%;
      height: 100%;
      object-fit: cover;
      display:block;
    }
    .art .label{
      position:absolute;
      left: 10px;
      bottom: 10px;
      right: 10px;
      background: rgba(18, 24, 28, .72);
      color: #fff;
      border-radius: 12px;
      padding: 8px 10px;
      font-size: 11px;
      line-height: 1.45;
    }
    .form-grid{ display:grid; grid-template-columns: repeat(12, minmax(0, 1fr)); gap: 12px; }
    .form-actions{
      display:flex;
      flex-wrap:wrap;
      gap: 10px;
      justify-content:flex-end;
      margin-top: 16px;
    }
    .page{
      display:none;
      animation: fadeUp .24s ease both;
    }
    .page.active{ display:block; }
    @keyframes fadeUp{
      from{ opacity: 0; transform: translateY(8px); }
      to{ opacity: 1; transform: translateY(0); }
    }
    .page-stack{ display:grid; gap: 16px; }
    .type-picker{
      display:grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .type-card{
      border-radius: 20px;
      padding: 16px;
      border: 1px solid rgba(36,36,36,.1);
      background: rgba(255,255,255,.76);
      cursor: pointer;
      text-align:left;
      transition: transform .18s ease, border-color .18s ease, box-shadow .18s ease;
      min-height: 150px;
      display:flex;
      flex-direction:column;
      gap: 10px;
      justify-content:space-between;
    }
    .type-card:hover{ transform: translateY(-2px); box-shadow: var(--shadow-soft); }
    .type-card.active{
      border-color: rgba(18,58,74,.34);
      background: linear-gradient(180deg, rgba(18,58,74,.06), rgba(255,255,255,.88));
      box-shadow: 0 0 0 4px rgba(18,58,74,.08);
    }
    .type-card h4{
      margin: 0;
      font-size: 18px;
      font-family: var(--font-display);
    }
    .type-card p{
      margin: 0;
      color: var(--muted);
      font-size: 13px;
      line-height: 1.65;
    }
    .type-card .mark{
      display:inline-flex;
      width: 42px;
      height: 42px;
      border-radius: 14px;
      align-items:center;
      justify-content:center;
      font-weight: 900;
      color: #fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
    }
    .type-card.exchange .mark{ background: linear-gradient(135deg, var(--accent), var(--accent-2)); }
    .subtabs{
      display:flex;
      flex-wrap: wrap;
      gap: 8px;
      margin-bottom: 12px;
    }
    .tab-btn{
      min-height: 36px;
      padding: 0 14px;
      border-radius: 999px;
      background: rgba(255,255,255,.78);
      border: 1px solid rgba(36,36,36,.12);
      color: var(--text);
      font-size: 12px;
      font-weight: 800;
    }
    .tab-btn.active{
      color:#fff;
      background: linear-gradient(135deg, var(--brand), var(--brand-2));
      border-color: transparent;
    }
    .split-2{
      display:grid;
      grid-template-columns: 1.08fr .92fr;
      gap: 14px;
    }
    .panel{
      border: 1px solid rgba(36,36,36,.08);
      border-radius: 20px;
      background: rgba(255,255,255,.74);
      padding: 14px;
    }
    .panel-title{
      display:flex;
      align-items:flex-start;
      justify-content:space-between;
      gap: 12px;
      margin-bottom: 12px;
    }
    .panel-title h4{ font-size: 17px; }
    .panel-title p{
      margin: 6px 0 0;
      font-size: 12px;
      color: var(--muted);
      line-height: 1.55;
    }
    .combo-list{
      display:grid;
      gap: 10px;
    }
    .combo-item{
      border: 1px solid rgba(36,36,36,.08);
      border-radius: 16px;
      background: rgba(255,255,255,.8);
      padding: 12px;
      display:grid;
      gap: 10px;
    }
    .combo-head{
      display:flex;
      justify-content:space-between;

      return new Promise((resolve) => {
        appState.confirmResolve = resolve;

      });

    function setPage(page, opts = {}){
      if (page === 'add' && !appState.add) appState.add = initAddDraft('discount');
      if (page === 'edit') appState.edit = clone(currentActivity());
      if (page === 'modify') appState.modify = null;
      appState.page = page;
      if (opts.activityId) appState.selectedActivityId = opts.activityId;
      if (opts.batchId) appState.selectedBatchId = opts.batchId;
      if (page === 'batch' && !opts.batchId) {
        const batch = currentActivity()?.batches?.[0];
        if (batch) appState.selectedBatchId = batch.id;
      }
      render();
      window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function allowedEdit(a){ return a.status === 'DRAFT'; }
    function allowedModify(a){ return a.status === 'EFFECTIVE'; }
    function allowedBatch(a){ return a.status === 'DRAFT' || a.status === 'EFFECTIVE'; }
    function allowedInvalidate(a){ return a.status === 'DRAFT' || a.status === 'EFFECTIVE'; }

    function filteredActivities(){
      return appState.activities.filter(a => {
        const f = appState.filters;
        const match = (val, q) => !q || String(val).toLowerCase().includes(String(q).toLowerCase());
        return match(a.name, f.name)
          && match(a.id, f.id)
          && match(a.extId, f.extId)
          && (!f.status || a.status === f.status)
          && (!f.type || a.couponType === f.type);
      });

          </div>
          ${isDiscount ? `
            <div class="form-grid">
              <div class="field span-4">
                <label>门槛金额<span class="hint">必填</span></label>
                <input data-scope="${scope}" data-field="threshold" type="number" min="0" value="${esc(d.threshold || '')}" placeholder="如 199" />

              </div>
              <div class="field span-4">
                <label>减免金额<span class="hint">必填</span></label>
                <input data-scope="${scope}" data-field="discount" type="number" min="0" value="${esc(d.discount || '')}" placeholder="如 50" />

              </div>
              <div class="field span-12">
                <label>满减说明<span class="hint">可选</span></label>
                <textarea data-scope="${scope}" data-field="discountNote" placeholder="补充说明、限制条件等">${esc(d.discountNote || '')}</textarea>
              </div>
            </div>

            <div class="form-grid">
              <div class="field span-4">
                <label>商品原价<span class="hint">必填</span></label>
                <input data-scope="${scope}" data-field="price" type="number" min="0" value="${esc(d.price || '')}" placeholder="如 128" />

        </div>

        <div class="section-gap"></div>

        <div class="preview-grid">
          <div class="art"><img src="${esc(previewCover)}" alt=""><div class="label">商品券图片预览</div></div>
          <div class="art"><img src="${esc(previewBg)}" alt=""><div class="label">商品券背景图预览</div></div>
          <div class="art"><img src="${esc(previewDetail)}" alt=""><div class="label">商品券详情图预览</div></div>
        </div>

        <div class="form-actions">
          ${scope === 'edit' ? `<button class="btn ghost" data-action="edit-back-detail">返回详情</button>` : `<button class="btn ghost" data-action="add-back-type">返回券类型选择页</button>`}

    function renderComboEditor(scope, combos){
      const items = (combos && combos.length ? combos : [blankCombo()]).map((combo, idx) => `
        <div class="combo-item" data-combo-index="${idx}">
          <div class="combo-head">
            <strong>组合 ${idx + 1}</strong>
            <div class="inline-actions">
              <button class="mini-btn" data-action="add-combo" data-scope="${scope}">新增组合</button>
              <button class="mini-btn red" data-action="remove-combo" data-scope="${scope}" data-index="${idx}" ${idx === 0 && combos.length <= 1 ? 'disabled' : ''}>删除组合</button>
            </div>
          </div>
          <div class="form-grid">
            <div class="field span-6">
              <label>组合名称<span class="hint">必填</span></label>
              <input data-scope="${scope}" data-field="comboName" data-index="${idx}" value="${esc(combo.name || '')}" placeholder="如 会员礼盒" />
            </div>
            <div class="field span-3">
              <label>组合数量<span class="hint">必填</span></label>
              <input data-scope="${scope}" data-field="comboQuantity" data-index="${idx}" type="number" min="1" value="${esc(combo.quantity || 1)}" />
            </div>
          </div>
          <div class="combo-products">
            ${(combo.products || []).map((p, pIdx) => `
              <div class="product-line" data-product-index="${pIdx}">
                <input data-scope="${scope}" data-field="productName" data-index="${idx}" data-product="${pIdx}" value="${esc(p.name || '')}" placeholder="商品名称" />
                <input data-scope="${scope}" data-field="productPrice" data-index="${idx}" data-product="${pIdx}" type="number" min="0" value="${esc(p.price || '')}" placeholder="单价" />
                <input data-scope="${scope}" data-field="productCount" data-index="${idx}" data-product="${pIdx}" type="number" min="1" value="${esc(p.count || 1)}" placeholder="数量" />
                <input data-scope="${scope}" data-field="productAppid" data-index="${idx}" data-product="${pIdx}" value="${esc(p.appid || '')}" placeholder="AppID" />
                <input data-scope="${scope}" data-field="productPath" data-index="${idx}" data-product="${pIdx}" value="${esc(p.path || '')}" placeholder="小程序路径" />
                <button class="mini-btn red" data-action="remove-product" data-scope="${scope}" data-index="${idx}" data-product="${pIdx}" ${combo.products.length <= 1 ? 'disabled' : ''}>删除</button>
              </div>
            `).join('')}
          </div>
          <div class="inline-actions">
            <button class="mini-btn primary" data-action="add-product" data-scope="${scope}" data-index="${idx}">新增单品</button>
          </div>
        </div>
      `).join('');
      return `<div class="combo-list">${items}</div>`;
    }

            </div>
            <div class="section-gap"></div>

                    <button class="btn ghost" data-action="back-list">返回</button>

    function renderBatchRow(batch, activity){
      const canPause = batch.status === 'SENDING';
      const canContinue = batch.status === 'PAUSED';
      const canSend = batch.status === 'READY' || batch.status === 'AUDITING';
      const canStop = batch.status === 'SENDING' || batch.status === 'PAUSED';
      const canEdit = activity.status !== 'DEACTIVATED';
      return `
        <tr>
          <td><code style="color:#8a4d14;">${esc(batch.id)}</code></td>
          <td>${esc(batch.name)}</td>
          <td><span class="status-tag ${batchStateClass(batch.status)}">${esc(batchState(batch.status))}</span></td>
          <td>${esc(fmtDate(batch.start))}</td>
          <td>${esc(fmtDate(batch.end))}</td>
          <td>${esc(batch.codeTotal)}</td>
          <td>${esc(batch.codeAvailable)}</td>
          <td>${esc(batch.issued)}</td>
          <td>${esc(activity.creator)}</td>
          <td>${esc(activity.modifier)}</td>
          <td>
            <div class="row-actions">
              <button class="mini-btn primary" data-action="select-batch" data-id="${esc(batch.id)}">查看</button>
              <button class="mini-btn blue" data-action="batch-edit-basic" data-id="${esc(batch.id)}" ${canEdit ? '' : 'disabled'}>预配置编辑</button>
              <button class="mini-btn" data-action="batch-edit-budget" data-id="${esc(batch.id)}" ${canEdit ? '' : 'disabled'}>预算</button>
              <button class="mini-btn" data-action="batch-edit-store" data-id="${esc(batch.id)}" ${canEdit ? '' : 'disabled'}>门店关联</button>
              <button class="mini-btn green" data-action="batch-send" data-id="${esc(batch.id)}" ${canSend ? '' : 'disabled'}>发放</button>
              <button class="mini-btn" data-action="batch-pause" data-id="${esc(batch.id)}" ${canPause ? '' : 'disabled'}>暂停</button>
              <button class="mini-btn green" data-action="batch-continue" data-id="${esc(batch.id)}" ${canContinue ? '' : 'disabled'}>继续</button>
              <button class="mini-btn red" data-action="batch-stop" data-id="${esc(batch.id)}" ${canStop ? '' : 'disabled'}>失效</button>
            </div>
          </td>
        </tr>
      `;
    }

    function renderBatchDetailPane(activity, batch, canEnter){
      const tabs = ['basic','date','budget','store','code','notify','control'];
      const tabMap = {
        basic: '基础信息',
        date: '日期窗',
        budget: '预算配置',
        store: '门店关联',
        code: 'Code结果',
        notify: '通知配置',
        control: '发放控制',
      };
      const editable = canEnter && activity.status !== 'DEACTIVATED';
      return `
        <div class="stack">
          <div class="subtabs">
            ${tabs.map(t => `<button class="tab-btn ${batch.tab === t ? 'active' : ''}" data-action="switch-batch-tab" data-tab="${t}" ${editable ? '' : 'disabled'}>${tabMap[t]}</button>`).join('')}
          </div>
          ${renderBatchTab(activity, batch)}
          <div class="form-actions" style="justify-content:flex-start;">
            <button class="btn" data-action="save-batch" data-id="${esc(batch.id)}" ${editable ? '' : 'disabled'}>保存预配置</button>
            <button class="btn" data-action="save-batch-code" data-id="${esc(batch.id)}" ${editable ? '' : 'disabled'}>保存并校验</button>
            <button class="btn green" data-action="batch-send" data-id="${esc(batch.id)}" ${(batch.status === 'READY' || batch.status === 'AUDITING') && editable ? '' : 'disabled'}>发放</button>
            <button class="btn" data-action="batch-pause" data-id="${esc(batch.id)}" ${batch.status === 'SENDING' && editable ? '' : 'disabled'}>暂停</button>
            <button class="btn green" data-action="batch-continue" data-id="${esc(batch.id)}" ${batch.status === 'PAUSED' && editable ? '' : 'disabled'}>继续</button>
            <button class="btn red" data-action="batch-stop" data-id="${esc(batch.id)}" ${((batch.status === 'SENDING' || batch.status === 'PAUSED') && editable) ? '' : 'disabled'}>失效</button>
          </div>
        </div>
      `;
    }

    function renderBatchTab(activity, batch){
      const editable = activity.status !== 'DEACTIVATED';
      const tab = batch.tab;
      const locked = !editable;
      const fields = {
        basic: `
          <div class="form-grid">
            <div class="field span-6"><label>批次名称<span class="hint">可改</span></label><input data-scope="batch" data-field="name" data-id="${esc(batch.id)}" value="${esc(batch.name)}" ${locked ? 'readonly' : ''} /></div>
            <div class="field span-6"><label>批次ID<span class="hint">只读</span></label><input readonly value="${esc(batch.id)}" /></div>
            <div class="field span-6"><label>活动名称<span class="hint">只读</span></label><input readonly value="${esc(activity.name)}" /></div>
            <div class="field span-6"><label>批次状态<span class="hint">只读</span></label><input readonly value="${esc(batchState(batch.status))}" /></div>
            <div class="field span-12"><label>备注<span class="hint">可改</span></label><textarea data-scope="batch" data-field="remarks" data-id="${esc(batch.id)}" ${locked ? 'readonly' : ''}>${esc(batch.remarks || '')}</textarea></div>
          </div>
        `,
        date: `
          <div class="form-grid">
            <div class="field span-6"><label>发放开始日期<span class="hint">可改</span></label><input type="date" data-scope="batch" data-field="start" data-id="${esc(batch.id)}" value="${esc(batch.start)}" ${locked ? 'readonly' : ''} /></div>
            <div class="field span-6"><label>发放结束日期<span class="hint">可改</span></label><input type="date" data-scope="batch" data-field="end" data-id="${esc(batch.id)}" value="${esc(batch.end)}" ${locked ? 'readonly' : ''} /></div>
            <div class="field span-6"><label>可用天数<span class="hint">只读计算</span></label><input readonly value="${daysBetween(batch.start, batch.end)}" /></div>
            <div class="field span-6"><label>等待天数<span class="hint">仅演示</span></label><input readonly value="0" /></div>
          </div>
        `,
        budget: `
          <div class="form-grid">
            <div class="field span-4"><label>总预算<span class="hint">可改</span></label><input type="number" data-scope="batch" data-field="budgetTotal" data-id="${esc(batch.id)}" value="${esc(batch.budgetTotal)}" ${locked ? 'readonly' : ''} /></div>
            <div class="field span-4"><label>每日预算<span class="hint">可改</span></label><input type="number" data-scope="batch" data-field="dailyBudget" data-id="${esc(batch.id)}" value="${esc(batch.dailyBudget)}" ${locked ? 'readonly' : ''} /></div>
            <div class="field span-4"><label>每人限制<span class="hint">可改</span></label><input type="number" data-scope="batch" data-field="perUser" data-id="${esc(batch.id)}" value="${esc(batch.perUser)}" ${locked ? 'readonly' : ''} /></div>
          </div>
        `,
        store: `
          <div class="form-grid">
            <div class="field span-4"><label>门店范围<span class="hint">只读</span></label><input readonly value="${esc(batch.scope === 'SPECIFIC' ? '指定门店' : '全部门店')}" /></div>
            <div class="field span-4"><label>已关联门店数<span class="hint">只读</span></label><input readonly value="${esc(batch.storeCount || 0)}" /></div>
            <div class="field span-12"><label>门店列表<span class="hint">展示</span></label><textarea readonly>${esc((batch.stores || []).join('、') || '—')}</textarea></div>
          </div>
        `,
        code: `
          <div class="form-grid">
            <div class="field span-4"><label>券码结果状态<span class="hint">只读</span></label><input readonly value="${esc(batch.codeStatus)}" /></div>
            <div class="field span-4"><label>券码结果文件<span class="hint">只读</span></label><input readonly value="${esc(batch.codeFile)}" /></div>
            <div class="field span-4"><label>校验时间<span class="hint">只读</span></label><input readonly value="${esc(batch.codeCheckedAt)}" /></div>
            <div class="field span-12">
              <label>券码结果<span class="hint">自动生成 / 回传</span></label>
              <div class="hint-box info">当前原型仅展示系统自动生成 / 回传后的结果，不提供人工上传入口。</div>
            </div>
          </div>
        `,
        notify: `
          <div class="form-grid">
            <div class="field span-6"><label>通知配置<span class="hint">可改</span></label><select data-scope="batch" data-field="notify" data-id="${esc(batch.id)}" ${locked ? 'disabled' : ''}><option ${batch.notify === '开启微信通知' ? 'selected' : ''}>开启微信通知</option><option ${batch.notify === '关闭' ? 'selected' : ''}>关闭</option></select></div>
            <div class="field span-12"><label>通知说明<span class="hint">展示</span></label><textarea readonly>批次通知配置将按照页面展示层收集，不接入外部通知系统。</textarea></div>
          </div>
        `,
        control: `
          <div class="detail-grid">
            <div class="batch-stat"><div class="k">Code总量</div><div class="v">${esc(batch.codeTotal)}</div><div class="s">批次中已登记的券码总数。</div></div>
            <div class="batch-stat"><div class="k">可用Code</div><div class="v">${esc(batch.codeAvailable)}</div><div class="s">当前可继续发放的券码数量。</div></div>
            <div class="batch-stat"><div class="k">已发放量</div><div class="v">${esc(batch.issued)}</div><div class="s">累计已发放的券码数量。</div></div>
          </div>
          <div class="section-gap"></div>
          <div class="hint-box success">
            <strong>控制说明</strong><br/>
            发放中可暂停，已暂停可继续。<code>继续</code> 会把批次状态从 <strong>已暂停</strong> 恢复为 <strong>发放中</strong>。
          </div>

      };
      return fields[tab] || fields.basic;
    }

    function daysBetween(start, end){
      const s = new Date(start);
      const e = new Date(end);
      if (Number.isNaN(s.getTime()) || Number.isNaN(e.getTime())) return '—';
      return Math.max(0, Math.ceil((e - s) / (1000*60*60*24)) + 1);
    }

    function renderModal(){
      const m = appState.modal;
      if (!m) return '';
      return `
        <div class="modal-panel">
          <div class="modal-hd">
            <div>
              <h3>${esc(m.title)}</h3>
              <p>${esc(m.body)}</p>
            </div>
          </div>
          <div class="modal-bd">
            ${m.extra || ''}
          </div>
          <div class="modal-actions">
            ${m.buttons.map(btn => `<button class="btn ${btn.kind || 'ghost'}" data-action="${btn.action}">${esc(btn.text)}</button>`).join('')}
          </div>
        </div>
      `;
    }

    function bindDynamic(){
      document.querySelectorAll('[data-page]').forEach(btn => btn.onclick = () => setPage(btn.dataset.page));
      document.querySelectorAll('[data-action]').forEach(el => {
        if (el.dataset.bound) return;
        el.dataset.bound = '1';
        el.addEventListener('click', handleAction);
      });
      document.querySelectorAll('input[data-scope], textarea[data-scope], select[data-scope]').forEach(input => {
        input.oninput = onFieldChange;
        input.onchange = onFieldChange;
      });
      document.querySelectorAll('input[type="file"][data-file-scope]').forEach(input => {
        input.onchange = onFileChange;
      });
    }

    function onFieldChange(e){
      const el = e.target;
      const scope = el.dataset.scope;
      const field = el.dataset.field;
      const id = el.dataset.id;
      const value = el.type === 'number' ? el.value : el.value;
      if (scope === 'filter') {
        appState.filters[field] = value;
        return;
      }
      if (scope === 'add') {
        updateAddDraft(field, value);
        appState.dirty.add = true;
        render();
        return;
      }
      if (scope === 'edit') {
        updateEditDraft(field, value);
        appState.dirty.edit = true;
        render();
        return;
      }
      if (scope === 'modify') {
        updateModifyDraft(el.dataset.zone, field, value);
        appState.dirty.modify = true;
        render();
        return;
      }
      if (scope === 'batch' && id) {
        updateBatchField(id, field, value);
        appState.dirty.batch = true;
        render();
      }
    }

    function onFileChange(e){
      const el = e.target;
      const scope = el.dataset.fileScope;
      const field = el.dataset.field;
      const files = Array.from(el.files || []);
      if (!files.length) return;
      const urlList = files.map(file => URL.createObjectURL(file));
      if (scope === 'add') {
        if (field === 'details') {
          appState.add.details = urlList.slice(0, 8);
        } else {
          appState.add[field] = urlList[0];
        }
        appState.dirty.add = true;
      } else if (scope === 'modify') {
        appState.modify.supplement.details = urlList.slice(0, 8);
        appState.dirty.modify = true;
      }
      render();
    }

    function updateAddDraft(field, value){
      if (field === 'couponType') return;
      if (field === 'batchReadyCount') {
        appState.add.batchReadyCount = Number(value || 0);
        return;
      }
      if (field === 'comboName' || field === 'comboQuantity' || field === 'productName' || field === 'productPrice' || field === 'productCount' || field === 'productAppid' || field === 'productPath') {
        return; // handled separately via action targeting to keep render simpler
      }
      appState.add[field] = value;
    }
    function updateEditDraft(field, value){
      if (!appState.edit) appState.edit = clone(currentActivity());
      if (field === 'batchReadyCount') {
        appState.edit.batchReadyCount = Number(value || 0);
        return;
      }
      appState.edit[field] = value;
    }
    function updateModifyDraft(zone, field, value){
      if (zone === 'main') appState.modify.main[field] = value;
      if (zone === 'supplement') appState.modify.supplement[field] = value;
    }
    function updateBatchField(id, field, value){
      const a = currentActivity();
      const batch = a.batches.find(b => b.id === id);
      if (!batch) return;
      batch[field] = value;
    }

    function handleAction(e){
      const el = e.currentTarget;
      const action = el.dataset.action;
      const id = el.dataset.id;
      const tab = el.dataset.tab;
      const type = el.dataset.type;
      const scope = el.dataset.scope;
      const idx = Number(el.dataset.index);
      const pIdx = Number(el.dataset.product);

      if (action === 'go-list') return setPage('list');
      if (action === 'refresh-current') return render();
      if (action === 'reset-filters') {
        appState.filters = { name:'', id:'', extId:'', status:'', type:'' };
        return render();
      }
      if (action === 'apply-filters') return render();
      if (action === 'go-add') {
        appState.add = initAddDraft('discount');
        appState.dirty.add = false;
        return setPage('add');
      }
      if (action === 'add-back-list' || action === 'back-list') return setPage('list');
      if (action === 'back-detail' || action === 'edit-back-detail') return setPage('detail', { activityId: currentActivity().id });
      if (action === 'add-reset') {
        appState.add = initAddDraft('discount');
        appState.dirty.add = false;
        return render();
      }
      if (action === 'choose-type') {
        appState.add.couponType = type;
        if (type === 'exchange' && !appState.add.combos.length) appState.add.combos = [blankCombo()];
        if (type === 'discount') appState.add.combos = [];
        appState.dirty.add = true;
        return render();
      }
      if (action === 'add-back-type' || action === 'add-return-type') return render();
      if (action === 'add-cancel') {
        if (appState.dirty.add) {
          confirmDialog('放弃未保存内容？', '当前新增表单已有未保存内容，确认后将返回列表并丢弃本次输入。').then(ok => {
            if (ok) {
              appState.add = initAddDraft('discount');
              appState.dirty.add = false;
              setPage('list');
            }
          });
          return;
        }
        appState.add = initAddDraft('discount');
        return setPage('list');
      }
      if (action === 'edit-cancel') {
        if (appState.dirty.edit) {
          confirmDialog('放弃未保存内容？', '当前编辑页已有未保存修改，确认后将丢弃当前内容并返回详情页。').then(ok => {
            if (ok) {
              appState.edit = null;
              appState.dirty.edit = false;
              setPage('detail', { activityId: currentActivity().id });
            }
          });
          return;
        }
        appState.edit = null;
        return setPage('detail', { activityId: currentActivity().id });
      }
      if (action === 'modify-cancel') {
        if (appState.dirty.modify) {
          confirmDialog('放弃未保存修改？', '当前活动修改页存在未保存内容，确认后将丢弃。').then(ok => {
            if (ok) {
              appState.modify = null;
              appState.dirty.modify = false;
              setPage('detail', { activityId: currentActivity().id });
            }
          });
          return;
        }
        appState.modify = null;
        return setPage('detail', { activityId: currentActivity().id });
      }
      if (action === 'modify-reset') {
        appState.modify = null;
        appState.dirty.modify = false;
        return render();
      }
      if (action === 'save-draft' || action === 'edit-save-draft') {
        const scopeName = action === 'save-draft' ? 'add' : 'edit';
        const draft = scopeName === 'add' ? appState.add : appState.edit;
        const errors = validateActivityDraft(draft, false);
        if (Object.keys(errors).length) {
          return showFieldErrors(scopeName, errors, '草稿保存失败');
        }
        const activity = scopeName === 'add' ? createActivityFromDraft(draft) : patchActivityFromDraft(currentActivity(), draft);
        upsertActivity(activity);
        appState.dirty[scopeName] = false;
        pushToast('保存草稿成功', `${draft.name || '未命名活动'} 已保存为草稿。`);
        if (scopeName === 'add') {
          appState.add = initAddDraft(draft.couponType || 'discount');
          setPage('detail', { activityId: activity.id });
        } else {
          appState.edit = clone(activity);
          setPage('detail', { activityId: activity.id });
        }
        return;
      }
      if (action === 'submit-review' || action === 'edit-submit-review') {
        const scopeName = action === 'submit-review' ? 'add' : 'edit';
        const draft = scopeName === 'add' ? appState.add : appState.edit;
        const errors = validateActivityDraft(draft, true);
        if (Object.keys(errors).length) {
          return showFieldErrors(scopeName, errors, '提交审核失败');
        }
        const activity = scopeName === 'add' ? createActivityFromDraft(draft) : patchActivityFromDraft(currentActivity(), draft);
        activity.status = 'AUDITING';
        activity.updatedAt = stamp();
        upsertActivity(activity);
        appState.dirty[scopeName] = false;
        pushToast('提交审核成功', `${activity.name} 已进入审批中。`);
        appState.add = initAddDraft('discount');
        appState.edit = clone(activity);
        return setPage('detail', { activityId: activity.id });
      }
      if (action === 'open-detail') return setPage('detail', { activityId: id });
      if (action === 'open-edit') {
        const act = findActivity(id);
        if (!act || !allowedEdit(act)) return pushToast('无法进入编辑页', '仅草稿活动可进入编辑页。');
        appState.edit = clone(act);
        appState.dirty.edit = false;
        return setPage('edit', { activityId: id });
      }
      if (action === 'open-modify') {
        const act = findActivity(id);
        if (!act || !allowedModify(act)) return pushToast('无法进入修改页', '仅生效中活动可进入修改页。');
        appState.modify = null;
        appState.dirty.modify = false;
        return setPage('modify', { activityId: id });
      }
      if (action === 'open-batch') {
        const act = findActivity(id);
        if (!act || !allowedBatch(act)) return pushToast('无法进入批次管理页', '当前状态不允许进入批次管理页。');
        const first = act.batches[0];
        if (first) appState.selectedBatchId = first.id;
        return setPage('batch', { activityId: id, batchId: first ? first.id : null });
      }
      if (action === 'invalidate-activity') {
        const act = findActivity(id);
        if (!act || !allowedInvalidate(act)) return;
        confirmDialog('确认失效活动？', `失效后，活动将进入已失效状态，所有批次也会被同步标记为已失效。`).then(ok => {
          if (!ok) return;
          act.status = 'DEACTIVATED';
          act.modifier = '系统';
          act.updatedAt = stamp();
          act.batches.forEach(b => b.status = 'DEACTIVATED');
          appState.selectedActivityId = act.id;
          appState.selectedBatchId = act.batches[0]?.id || null;
          pushToast('活动已失效', `${act.name} 已标记为已失效。`);
          setPage('detail', { activityId: act.id });
        });
        return;
      }
      if (action === 'batch-new') {
        const act = currentActivity();
        if (!editableState(act)) return pushToast('无法新建批次', '当前状态不允许新建批次。');
        const newBatch = {
          id: uid('B-'),
          name: `新建批次-${act.batches.length + 1}`,
          status: 'READY',
          start: todayISO(),
          end: tomorrowISO(7),
          codeTotal: 1000,
          codeAvailable: 1000,
          issued: 0,
          scope: 'ALL',
          budgetTotal: 5000,
          dailyBudget: 500,
          perUser: 1,
          storeCount: 0,
          stores: [],
          notify: '关闭',
          codeStatus: '待校验',
          codeFile: '系统自动生成',
          codeCheckedAt: '—',
          remarks: '',
          tab: 'basic',
        };
        act.batches.unshift(newBatch);
        appState.selectedBatchId = newBatch.id;
        pushToast('已新建批次', '可以继续配置预配置、预算、门店和券码结果。');
        return render();
      }
      if (action === 'select-batch') {
        appState.selectedBatchId = id;
        const act = currentActivity();
        const batch = act.batches.find(b => b.id === id);
        if (batch) batch.tab = batch.tab || 'basic';
        return render();
      }
      if (action === 'switch-batch-tab') {
        const act = currentActivity();
        const batch = act.batches.find(b => b.id === appState.selectedBatchId);
        if (batch) batch.tab = tab;
        return render();
      }
      if (action === 'save-batch') {
        const act = currentActivity();
        const batch = currentBatch();
        if (!batch || !editableState(act)) return;
        batch.remarks = batch.remarks || '';
        batch.status = batch.status === 'DEACTIVATED' ? 'DEACTIVATED' : batch.status;
        batch.codeFile = batch.codeFile || 'system-generated-codes.xlsx';
        pushToast('保存预配置成功', `${batch.name} 已保存。`);
        return render();
      }
      if (action === 'save-batch-code') {
        const act = currentActivity();
        const batch = currentBatch();
        if (!batch || !editableState(act)) return;
        batch.codeStatus = '已校验';
        batch.codeFile = batch.codeFile === '—' ? 'system-generated-codes.xlsx' : batch.codeFile;
        batch.codeCheckedAt = stamp();
        pushToast('保存并校验成功', `${batch.name} 的券码结果已自动生成 / 回传并完成校验。`);
        return render();
      }
      if (action === 'batch-edit-basic' || action === 'batch-edit-budget' || action === 'batch-edit-store') {
        const act = currentActivity();
        const batch = act.batches.find(x => x.id === id);
        if (!batch || !editableState(act)) return;
        appState.selectedBatchId = id;
        batch.tab = action === 'batch-edit-basic' ? 'basic' : action === 'batch-edit-budget' ? 'budget' : 'store';
        setPage('batch', { activityId: act.id, batchId: id });
        return;
      }
      if (action === 'batch-send') {
        const act = currentActivity();
        const batch = findBatch(id);
        if (!batch || !editableState(act)) return;
        if (!(batch.status === 'READY' || batch.status === 'AUDITING' || batch.status === 'PAUSED')) return;
        batch.status = 'SENDING';
        batch.codeStatus = '已校验';
        batch.codeCheckedAt = batch.codeCheckedAt === '—' ? stamp() : batch.codeCheckedAt;
        act.modifier = '系统';
        act.updatedAt = stamp();
        appState.selectedBatchId = batch.id;
        pushToast('已开始发放', `${batch.name} 进入发放中。`);
        return render();
      }
      if (action === 'batch-pause') {
        const act = currentActivity();
        const batch = findBatch(id);
        if (!batch || !editableState(act)) return;
        if (batch.status !== 'SENDING') return;
        batch.status = 'PAUSED';
        act.updatedAt = stamp();
        appState.selectedBatchId = batch.id;
        pushToast('已暂停发放', `${batch.name} 已切换为已暂停。`);
        return render();
      }
      if (action === 'batch-continue') {
        const act = currentActivity();
        const batch = findBatch(id);
        if (!batch || !editableState(act)) return;
        if (batch.status !== 'PAUSED') return;
        batch.status = 'SENDING';
        act.updatedAt = stamp();
        appState.selectedBatchId = batch.id;
        pushToast('已继续发放', `${batch.name} 已恢复为发放中。`);
        return render();
      }
      if (action === 'batch-stop') {
        const act = currentActivity();
        const batch = findBatch(id);
        if (!batch || !editableState(act)) return;
        if (!(batch.status === 'SENDING' || batch.status === 'PAUSED')) return;
        confirmDialog('确认失效批次？', `失效后，批次将停止发放并标记为已失效。`).then(ok => {
          if (!ok) return;
          batch.status = 'DEACTIVATED';
          act.updatedAt = stamp();
          appState.selectedBatchId = batch.id;
          pushToast('批次已失效', `${batch.name} 已标记为已失效。`);
          render();
        });
        return;
      }
      if (action === 'batch-return-list' || action === 'back-list') return setPage('list');
      if (action === 'modal-cancel') return closeModal();
      if (action === 'modal-ok' && appState.confirmResolve) {
        const resolve = appState.confirmResolve;
        appState.confirmResolve = null;
        resolve(true);
        closeModal();
        return;
      }
      if (action === 'modal-no') {
        if (appState.confirmResolve) {
          const resolve = appState.confirmResolve;
          appState.confirmResolve = null;
          resolve(false);
        }
        closeModal();
        return;
      }
      if (action === 'save-cancel') return closeModal();
      if (action === 'modify-save') {
        const act = currentActivity();
        if (!allowedModify(act)) return;
        const m = currentModifyDraft();
        act.title = m.main.title.trim();
        act.subtitle = m.main.subtitle.trim();
        act.productImage = m.main.image || act.productImage;
        act.backgroundImage = m.main.bg || act.backgroundImage;
        act.ruleSummary = m.supplement.ruleSummary.trim();
        if (m.supplement.details && m.supplement.details.length) act.details = m.supplement.details.slice(0, 8);
        act.modifier = '原型用户';
        act.updatedAt = stamp();
        appState.dirty.modify = false;
        appState.modify = null;
        pushToast('修改已保存', `${act.name} 的展示修正已更新。`);
        return setPage('detail', { activityId: act.id });
      }
      if (action === 'save-batch-code') return;
      if (action === 'choose-type') {
        appState.currentNewType = type;
        return render();
      }
      if (action === 'add-combo' || action === 'remove-combo' || action === 'add-product' || action === 'remove-product') {
        handleComboActions(action, scope, idx, pIdx);
        return render();
      }
    }

    function handleComboActions(action, scope, comboIndex, productIndex){
      const draft = scope === 'add' ? appState.add : appState.edit;
      if (!draft.combos || !draft.combos.length) draft.combos = [blankCombo()];
      if (action === 'add-combo') {
        draft.combos.push(blankCombo());
        return;
      }
      if (action === 'remove-combo') {
        if (draft.combos.length <= 1) return;
        draft.combos.splice(comboIndex, 1);
        return;
      }
      const combo = draft.combos[comboIndex];
      if (!combo) return;
      if (action === 'add-product') {
        combo.products.push({ name:'', price:'', count:1, image:'', appid:'', path:'' });
        return;
      }
      if (action === 'remove-product') {
        if (combo.products.length <= 1) return;
        combo.products.splice(productIndex, 1);
      }
    }

    function editableState(a){
      return a && a.status !== 'DEACTIVATED';
    }

    function validateActivityDraft(draft, submit){
      const errors = {};
      if (!draft.name || !draft.name.trim()) errors.name = '请填写商品券名称';
      if (!draft.extId || !draft.extId.trim()) errors.extId = '请填写外部商品ID';
      if (!draft.title || !draft.title.trim()) errors.title = '请填写商品券标题文案';
      if (!draft.ruleSummary || !draft.ruleSummary.trim()) errors.ruleSummary = '请填写规则摘要';
      if (draft.couponType === 'discount') {
        if (draft.threshold === '' || draft.threshold === null) errors.threshold = '请填写门槛金额';
        if (draft.discount === '' || draft.discount === null) errors.discount = '请填写减免金额';
        if (Number(draft.discount) > Number(draft.threshold || 0)) errors.discount = '减免金额不能大于门槛金额';
      }
      if (draft.couponType === 'exchange') {
        if (!draft.price && draft.price !== 0) errors.price = '请填写商品原价';
        const comboOk = draft.combos && draft.combos.some(c => c.name && c.products && c.products.some(p => p.name));
        if (!comboOk) errors.combos = '请至少配置 1 个有效商品组合';
      }
      const readyCount = Number(draft.batchReadyCount || 0);
      if (submit && readyCount < 1) errors.batchReadyCount = '提交审核至少需要 1 个已完成预配置且通过校验的批次';
      return errors;
    }

    function showFieldErrors(scope, errors, title){
      const scopeErrors = Object.entries(errors).map(([k, v]) => `${k}: ${v}`).join('；');
      pushToast(title, scopeErrors || '存在未通过的校验项。');
    }

    function createActivityFromDraft(draft){
      const a = {
        id: uid('ACT-'),
        name: draft.name.trim(),
        extId: draft.extId.trim(),
        couponType: draft.couponType,
        typeName: typeLabel[draft.couponType],
        status: 'DRAFT',
        scope: '全部门店',
        creator: '原型用户',
        modifier: '原型用户',
        createdAt: stamp(),
        updatedAt: stamp(),
        useMode: 'SINGLE',
        codeMode: 'UPLOAD',
        productImage: draft.image || svgArt('NEW', '新建活动', ['#123a4a', '#356b79', '#d76b36']),
        backgroundImage: draft.bg || svgArt('BG', '活动背景', ['#3b5d7a', '#1f7a57', '#e9c28d']),
        title: draft.title.trim(),
        subtitle: draft.subtitle.trim(),
        ruleSummary: draft.ruleSummary.trim(),
        threshold: draft.threshold === '' ? '' : Number(draft.threshold),
        discount: draft.discount === '' ? '' : Number(draft.discount),
        discountNote: draft.discountNote || '',
        price: draft.price === '' ? '' : Number(draft.price),
        combos: clone(draft.combos || []),
        details: draft.details.length ? draft.details.slice(0, 8) : [svgArt('DETAIL', '详情图', ['#123a4a', '#356b79', '#d76b36'])],
        batches: draft.batchReadyCount > 0 ? Array.from({ length: draft.batchReadyCount }).map((_, i) => ({
          id: uid('B-'),
          name: `草稿批次-${i + 1}`,
          status: 'READY',
          start: todayISO(),
          end: tomorrowISO(10),
          codeTotal: 1000,
          codeAvailable: 1000,
          issued: 0,
          scope: 'ALL',
          budgetTotal: 5000,
          dailyBudget: 500,
          perUser: 1,
          storeCount: 0,
          stores: [],
          notify: '关闭',
          codeStatus: '待校验',
          codeFile: '系统自动生成',
          codeCheckedAt: '—',
          remarks: '',
          tab: 'basic',
        })) : [],
      };
      return a;
    }

    function patchActivityFromDraft(activity, draft){
      const next = clone(activity);
      next.name = draft.name.trim();
      next.extId = draft.extId.trim();
      next.couponType = draft.couponType;
      next.typeName = typeLabel[draft.couponType];
      next.productImage = draft.image || next.productImage;
      next.backgroundImage = draft.bg || next.backgroundImage;
      next.title = draft.title.trim();
      next.subtitle = draft.subtitle.trim();
      next.ruleSummary = draft.ruleSummary.trim();
      next.threshold = draft.threshold === '' ? '' : Number(draft.threshold);
      next.discount = draft.discount === '' ? '' : Number(draft.discount);
      next.discountNote = draft.discountNote || '';
      next.price = draft.price === '' ? '' : Number(draft.price);
      next.combos = clone(draft.combos || []);
      next.updatedAt = stamp();
      next.modifier = '原型用户';
      return next;
    }

    function upsertActivity(activity){
      const idx = appState.activities.findIndex(a => a.id === activity.id);
      if (idx >= 0) appState.activities[idx] = activity;
      else appState.activities.unshift(activity);
      appState.selectedActivityId = activity.id;
      if (activity.batches && activity.batches[0]) appState.selectedBatchId = activity.batches[0].id;
    }

    function findActivity(id){ return appState.activities.find(a => a.id === id); }
    function findBatch(id){
      const a = currentActivity();
      return a?.batches?.find(b => b.id === id);
    }
    function stamp(){
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())} ${pad(d.getHours())}:${pad(d.getMinutes())}`;
    }
    function todayISO(){
      const d = new Date();
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    }
    function tomorrowISO(days){
      const d = new Date();
      d.setDate(d.getDate() + days);
      const pad = (n) => String(n).padStart(2, '0');
      return `${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
    }

    window.addEventListener('keydown', (e) => {
      if (e.key === 'Escape' && appState.modal) {
        closeModal();
      }
    });

    document.getElementById('modal').addEventListener('click', (e) => {
      if (e.target.id === 'modal') closeModal();
    });

    // seed current add type
    appState.currentNewType = 'discount';
    render();
  </script>
</body>
</html>
